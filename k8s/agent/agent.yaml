apiVersion: v1
kind: Namespace
metadata:
  name: opsagent-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsagent
  namespace: opsagent-system
---
# Read-only: the agent can inspect pods/logs/events, never mutate anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opsagent-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opsagent-readonly
subjects:
  - kind: ServiceAccount
    name: opsagent
    namespace: opsagent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opsagent-readonly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsagent
  namespace: opsagent-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: opsagent}
  template:
    metadata:
      labels: {app: opsagent}
    spec:
      serviceAccountName: opsagent
      containers:
        - name: agent
          image: opsagent/agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - secretRef: {name: opsagent-secrets, optional: true}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: opsagent
  namespace: opsagent-system
spec:
  selector: {app: opsagent}
  ports: [{port: 80, targetPort: 8000}]
