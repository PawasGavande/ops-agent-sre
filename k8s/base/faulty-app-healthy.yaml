apiVersion: apps/v1
kind: Deployment
metadata:
  name: faulty-app-healthy
  namespace: opsagent-demo
  labels:
    app: faulty-app-healthy
    opsagent/fault: healthy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faulty-app-healthy
  template:
    metadata:
      labels:
        app: faulty-app-healthy
        opsagent/fault: healthy
    spec:
      containers:
        - name: app
          image: opsagent/faulty-app:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: FAULT_MODE
              value: "healthy"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
